<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IA_Parkinson_Logic — Zero Trust, Offline-Native</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e5e7eb;margin:0}
.container{max-width:900px;margin:40px auto;padding:24px;background:#020617;border-radius:12px;border:1px solid #1f2937}
h1{color:#f97316;font-size:1.6rem}
h2{color:#38bdf8;font-size:1.1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
label{display:block;font-size:.9rem;color:#cbd5f5}
input[type=number]{width:100%;padding:6px 8px;border-radius:6px;border:1px solid #334155;background:#020617;color:#e5e7eb}
.btn-row{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
button{padding:8px 14px;border:none;border-radius:6px}
.btn-primary{background:#f97316;color:#0b1120;font-weight:600}
.btn-secondary{background:#1f2937;color:#e5e7eb}
.result{margin-top:20px;padding:12px;border:1px solid #334155;border-radius:8px}
.result-flag-ok{color:#22c55e}.result-flag-risk{color:#f97316}
.bridge{color:#93c5fd;font-size:.85rem;margin-top:8px}
.footer-note{margin-top:16px;font-size:.8rem;color:#9ca3af}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>IA_Parkinson_Logic — Démo zero trust, offline-native</h1>
<p>Scoring local. Le pont 127.0.0.1:8000/score est optionnel.</p>
<div class="grid">
<div><label>Tremblement</label><input type="number" id="tremor_intensity" min="0" max="1" step="0.01" value="0.0"></div>
<div><label>Rigidité</label><input type="number" id="rigidity_level" min="0" max="1" step="0.01" value="0.0"></div>
<div><label>Bradykinésie</label><input type="number" id="bradykinesia_level" min="0" max="1" step="0.01" value="0.0"></div>
<div><label>Vitesse</label><input type="number" id="motor_speed" min="0" max="1" step="0.01" value="1.0"></div>
<div><label>Amplitude</label><input type="number" id="movement_amplitude" min="0" max="1" step="0.01" value="1.0"></div>
<div><label>Régularité</label><input type="number" id="movement_regularities" min="0" max="1" step="0.01" value="1.0"></div>
</div>
<div class="btn-row">
<button class="btn-primary" onclick="runPipeline()">Calculer</button>
<button class="btn-secondary" onclick="resetForm()">Réinitialiser</button>
</div>
<div id="result" class="result" style="display:none"></div>
<p class="footer-note">Scoring démonstratif. Ne remplace pas un avis médical.</p>
</div>
<script>
const SCORE_URL="http://127.0.0.1:8000/score", API_KEY="demo-api-key-h3";
function clamp(v){if(isNaN(v))return 0;return Math.min(1,Math.max(0,v));}
function readFeature(id){const el=document.getElementById(id);const v=clamp(parseFloat(el.value));el.value=v.toFixed(2);return v;}
function runPipeline(){
  const f={tremor_intensity:readFeature("tremor_intensity"),rigidity_level:readFeature("rigidity_level"),bradykinesia_level:readFeature("bradykinesia_level"),motor_speed:readFeature("motor_speed"),movement_amplitude:readFeature("movement_amplitude"),movement_regularities:readFeature("movement_regularities")};
  const score=clamp(0.25*f.tremor_intensity+0.20*f.rigidity_level+0.25*f.bradykinesia_level+0.10*(1-f.motor_speed)+0.10*(1-f.movement_amplitude)+0.10*(1-f.movement_regularities));
  const risque=score>=0.6?"eleve":"non_detecte";
  window.dernierScore=score;window.dernierRisque=risque;
  const r=document.getElementById("result");r.style.display="block";
  r.innerHTML="<strong>Score:</strong> "+score.toFixed(3)+"<br><strong>Risque:</strong> "+(score>=0.6?"OUI":"NON")+"<div class='bridge' id='bridge'>Pont ZT : envoi local…</div>";
  fetch(SCORE_URL,{method:"POST",headers:{"Content-Type":"application/json","X-API-Key":API_KEY},body:JSON.stringify({source:"ia_parkinson_logic",score:score,decision:{risque:risque,features:f}})})
    .then(function(res){if(!res.ok)throw new Error("http");return res.json();})
    .then(function(d){document.getElementById("bridge").textContent="Pont ZT : scellé ("+(d.hash||"ok")+")";})
    .catch(function(){document.getElementById("bridge").textContent="Pont ZT : serveur absent — hors-ligne.";});
}
function resetForm(){["tremor_intensity","rigidity_level","bradykinesia_level"].forEach(function(id){document.getElementById(id).value="0.00";});
["motor_speed","movement_amplitude","movement_regularities"].forEach(function(id){document.getElementById(id).value="1.00";});
document.getElementById("result").style.display="none";}
</script>
</body>
</html>
